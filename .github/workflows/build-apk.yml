name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: telegram-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -d "$ANDROID_HOME/ndk/27.2.12479018" ]; then
            echo "ndk.dir=$ANDROID_HOME/ndk/27.2.12479018" >> local.properties
          fi
          cat local.properties

      - name: Check Toloram API credentials
        id: api_credentials
        env:
          TOLORAM_TG_API_ID: ${{ secrets.TOLORAM_TG_API_ID }}
          TOLORAM_TG_API_HASH: ${{ secrets.TOLORAM_TG_API_HASH }}
          VICHGRAM_TG_API_ID: ${{ secrets.VICHGRAM_TG_API_ID }}
          VICHGRAM_TG_API_HASH: ${{ secrets.VICHGRAM_TG_API_HASH }}
        run: |
          ID="${TOLORAM_TG_API_ID:-$VICHGRAM_TG_API_ID}"
          HASH="${TOLORAM_TG_API_HASH:-$VICHGRAM_TG_API_HASH}"
          if [ -z "$ID" ] || [ -z "$HASH" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::API secrets missing in this repo. Add TOLORAM_TG_API_ID and TOLORAM_TG_API_HASH (or VICHGRAM_TG_*) in Settings → Secrets."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Toloram API credentials found."
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK (Toloram)
        env:
          TOLORAM_TG_API_ID: ${{ secrets.TOLORAM_TG_API_ID }}
          TOLORAM_TG_API_HASH: ${{ secrets.TOLORAM_TG_API_HASH }}
          VICHGRAM_TG_API_ID: ${{ secrets.VICHGRAM_TG_API_ID }}
          VICHGRAM_TG_API_HASH: ${{ secrets.VICHGRAM_TG_API_HASH }}
        run: ./gradlew --no-daemon --stacktrace --warning-mode all assembleAfatDebug

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toloram-debug-apk
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: warn
          retention-days: 14
