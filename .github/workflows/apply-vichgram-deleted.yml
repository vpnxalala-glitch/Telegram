name: Apply VichGram Keep Deleted

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch processDeletedMessages keep path
        run: |
          python3 << 'PY'
          import re
          from pathlib import Path
          path = Path("TMessagesProj/src/main/java/org/telegram/ui/ChatActivity.java")
          text = path.read_text(encoding="utf-8")
          if "VICHGRAM_KEEP_DELETED" in text:
              print("already patched")
              raise SystemExit(0)

          pattern = re.compile(
              r"(for \(int a = 0; a < size; a\+\+\) \{\s*"
              r"Integer mid = markAsDeletedMessages\.get\(a\);\s*"
              r"MessageObject obj = chatAdapter != null && chatAdapter\.isFiltered \? filteredMessagesDict\.get\(mid\) :\s*messagesDict\[loadIndex\]\.get\(mid\);)"
          )
          m = pattern.search(text)
          if not m:
              print("pattern not found")
              raise SystemExit(1)

          insert = m.group(1) + """
            // VICHGRAM_KEEP_DELETED: keep message in chat when feature is on
            if (VichGramPrefs.isWatchDeletedMessages() && obj != null) {
                VichGramMessageStore.saveDeleted(currentAccount, obj);
                obj.deleted = true;
                if (chatAdapter != null) {
                    chatAdapter.updateRowWithMessageObject(obj, false, false);
                }
                continue;
            }"""
          text = pattern.sub(insert, text, count=1)
          path.write_text(text, encoding="utf-8")
          print("patched ok")
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TMessagesProj/src/main/java/org/telegram/ui/ChatActivity.java
          git commit -m "VichGram: keep deleted messages in chat when feature enabled" || exit 0
          git push
