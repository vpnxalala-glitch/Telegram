name: Apply VichGram Keep Deleted

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch processDeletedMessages keep path
        run: |
          python3 << 'PY'
          from pathlib import Path
          path = Path('TMessagesProj/src/main/java/org/telegram/ui/ChatActivity.java')
          text = path.read_text(encoding='utf-8')
          if 'VICHGRAM_KEEP_DELETED' in text:
              print('already patched')
              raise SystemExit(0)

          old = '''        for (int a = 0; a < size; a++) {
            Integer mid = markAsDeletedMessages.get(a);
            MessageObject obj = chatAdapter != null && chatAdapter.isFiltered ? filteredMessagesDict.get(mid) :  messagesDict[loadIndex].get(mid);'''

          new = '''        for (int a = 0; a < size; a++) {
            Integer mid = markAsDeletedMessages.get(a);
            MessageObject obj = chatAdapter != null && chatAdapter.isFiltered ? filteredMessagesDict.get(mid) :  messagesDict[loadIndex].get(mid);
            // VICHGRAM_KEEP_DELETED: keep message in chat when feature is on
            if (VichGramPrefs.isWatchDeletedMessages() && obj != null) {
                VichGramMessageStore.saveDeleted(currentAccount, obj);
                obj.deleted = true;
                if (chatAdapter != null) {
                    chatAdapter.updateRowWithMessageObject(obj, false, false);
                }
                continue;
            }'''

          if old not in text:
              # try single space variant
              old2 = old.replace(':  messagesDict', ': messagesDict')
              new2 = new.replace(':  messagesDict', ': messagesDict')
              if old2 in text:
                  text = text.replace(old2, new2, 1)
                  print('patched variant2')
              else:
                  # dump nearby for debug
                  idx = text.find('for (int a = 0; a < size; a++) {\n            Integer mid = markAsDeletedMessages')
                  print('idx', idx)
                  if idx >= 0:
                      print(repr(text[idx:idx+220]))
                  raise SystemExit('pattern not found')
          else:
              text = text.replace(old, new, 1)
              print('patched variant1')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TMessagesProj/src/main/java/org/telegram/ui/ChatActivity.java
          git commit -m "VichGram: keep deleted messages in chat when feature enabled" || exit 0
          git push
