name: Restore SettingsActivity
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and restore SettingsActivity.java
        run: |
          python3 << 'PY'
          import base64, zlib, pathlib
          b64 = pathlib.Path("tools/SettingsActivity.java.zlib.b64").read_text().strip()
          data = zlib.decompress(base64.b64decode(b64))
          path = pathlib.Path("TMessagesProj/src/main/java/org/telegram/ui/SettingsActivity.java")
          path.write_bytes(data)
          print("restored", len(data), "bytes")
          PY
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add TMessagesProj/src/main/java/org/telegram/ui/SettingsActivity.java
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Restore full SettingsActivity with VichGram Features entry"
          git push
