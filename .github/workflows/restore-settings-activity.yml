name: Restore SettingsActivity

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore DownloadController + Turbo
        run: |
          set -eux
          GOOD=0497eabab4b5dabdb2ba28f1eaa9763e553c60d8
          TARGET=TMessagesProj/src/main/java/org/telegram/messenger/DownloadController.java
          git show "$GOOD:$TARGET" > "$TARGET"
          wc -c "$TARGET"
          python3 << 'PY'
          import re
          from pathlib import Path
          path = Path("TMessagesProj/src/main/java/org/telegram/messenger/DownloadController.java")
          text = path.read_text(encoding="utf-8")
          assert "class DownloadController" in text
          if "VichGramPrefs.isTurboMode" not in text:
              text, n1 = re.subn(
                  r'(public boolean canDownloadMedia\(MessageObject messageObject\)\s*\{)',
                  r'''\1
        // VichGram Turbo: always allow media download
        if (org.telegram.messenger.VichGramPrefs.isTurboMode()) {
            return true;
        }''',
                  text, count=1, flags=re.M)
              print("msg", n1)
              text, n2 = re.subn(
                  r'(public boolean canDownloadMedia\(int type, long size\)\s*\{)',
                  r'''\1
        // VichGram Turbo: no size/type limits
        if (org.telegram.messenger.VichGramPrefs.isTurboMode()) {
            return true;
        }''',
                  text, count=1, flags=re.M)
              print("type", n2)
              text, n3 = re.subn(
                  r'(public int canDownloadMediaType\(MessageObject messageObject\)\s*\{)',
                  r'''\1
        // VichGram Turbo
        if (org.telegram.messenger.VichGramPrefs.isTurboMode()) {
            return 2;
        }''',
                  text, count=1, flags=re.M)
              print("mediaType", n3)
              path.write_text(text, encoding="utf-8")
          print("size", path.stat().st_size, "hooks", text.count("isTurboMode"))
          PY

      - name: Push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add TMessagesProj/src/main/java/org/telegram/messenger/DownloadController.java
          git commit -m "VichGram: restore DownloadController + Turbo mode hooks" || exit 0
          git push
