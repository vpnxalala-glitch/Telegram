name: Restore SettingsActivity

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore file from history
        run: |
          set -eux
          GOOD=2f286f864e2b7d68cc2c2d5cb62c57ab75489661
          TARGET=TMessagesProj/src/main/java/org/telegram/ui/SettingsActivity.java
          git show "$GOOD:$TARGET" > "$TARGET"
          grep -q "class SettingsActivity" "$TARGET"
          # Features menu entry
          python3 -c "
          from pathlib import Path
          p=Path('$TARGET')
          t=p.read_text()
          n='items.add(SettingCell.Factory.of(9, IconBackgroundColors.ORANGE_DEEP.top, IconBackgroundColors.ORANGE_DEEP.bottom, R.drawable.settings_power, getString(R.string.SettingsPowerSaving), getString(R.string.SettingsPowerSavingInfo)));'
          i=n+chr(10)+'        items.add(SettingCell.Factory.of(30, IconBackgroundColors.PURPLE.top, IconBackgroundColors.PURPLE.bottom, R.drawable.settings_features, \"Функции\", \"Удалённые и изменённые сообщения\"));'
          if 'Factory.of(30,' not in t:
            assert n in t
            t=t.replace(n,i,1)
          c='            case 24: {\n                presentFragment(new RoundVideoSettingsActivity());\n                break;\n            }\n        }\n    }'
          r='            case 24: {\n                presentFragment(new RoundVideoSettingsActivity());\n                break;\n            }\n            case 30: {\n                presentSettingFragment(new VichGramFeaturesActivity());\n                break;\n            }\n        }\n    }'
          if 'case 30:' not in t:
            assert c in t
            t=t.replace(c,r,1)
          p.write_text(t)
          print('ok', len(t))
          "

      - name: Push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add TMessagesProj/src/main/java/org/telegram/ui/SettingsActivity.java
          git commit -m 'Restore SettingsActivity + Features menu' || exit 0
          git push
