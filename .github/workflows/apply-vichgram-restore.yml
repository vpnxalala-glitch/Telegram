name: Apply VichGram Restore Deleted On Load

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/patch_restore_deleted.py'
      - '.github/workflows/apply-vichgram-restore.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 40
      - name: Run patch
        run: python3 tools/patch_restore_deleted.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TMessagesProj/src/main/java/org/telegram/messenger/DownloadController.java
          git commit -m "VichGram: restore DownloadController + Turbo mode hooks" || exit 0
          git push
